<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/all.min.css" />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Weather</title>
  </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">
          <div class="d-flex justify-content-center align-items-center">
            <div class="logo me-2">
              <img src="./img/logo@2x.png" alt="logo@2x" />
            </div>
            <div>
              <h1 class="text-white mb-0 fs-5">Weather</h1>
              <span class="text-white">tagline goes here</span>
            </div>
          </div>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link text-white" aria-current="page" href="#"
                >Home</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <!-- search -->
      <div
        id="heroSearch"
        class="d-flex justify-content-center align-items-center"
      >
        <div class="w-75 input-group postion-relative mt-2">
          <input
            type="text"
            class="form-control rounded-pill p-4"
            placeholder="Enter Your City..."
            id="inputSearch"
          />
          <button id="find" class="btn btn-primary rounded-pill">find</button>
        </div>
      </div>
      <!-- card-section -->
      <div class="container-weather" id="container-weather"></div>
    </main>
    <footer></footer>
    <script src="./js/bootstrap.bundle.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
